services:
  mongodb:
    image: 'mongo:latest'
    container_name: weather-mongodb
    environment:
      MONGO_INITDB_DATABASE: weather
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_ROOT_USERNAME: root
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - weather-network

  weather-app-1:
    build: .
    container_name: weather-app-1
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:root@mongodb:27017/weather?authSource=admin
      SERVER_PORT: 8080
    ports:
      - '8081:8080'
    networks:
      - weather-network

  weather-app-2:
    build: .
    container_name: weather-app-2
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:root@mongodb:27017/weather?authSource=admin
      SERVER_PORT: 8080
    ports:
      - '8082:8080'
    networks:
      - weather-network

  weather-app-3:
    build: .
    container_name: weather-app-3
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:root@mongodb:27017/weather?authSource=admin
      SERVER_PORT: 8080
    ports:
      - '8083:8080'
    networks:
      - weather-network

  nginx:
    image: 'nginx:latest'
    container_name: weather-loadbalancer
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weather-app-1
      - weather-app-2
      - weather-app-3
    networks:
      - weather-network

volumes:
  mongodb_data:

networks:
  weather-network:
    driver: bridge